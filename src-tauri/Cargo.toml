[package]
name = "app"
version = "1.0.0"
description = "Higher - 本地个人学习系统"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# DEV-MOBILE-001 F1 P0：Android 生产 .so 必须启用 tauri/custom-protocol
#（embedded assets；否则 runtime 走 build.devUrl=http://localhost:1420）。
# tauri CLI 构建时自动启用；Build-Higher-Android.ps1 直调 cargo 显式 --features。
# 仅声明不改变 Windows 默认构建行为。
[features]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
# DEV-0077.3 环境修复：显式关闭 tauri 默认 `common-controls-v6`——该 feature 使
# muda/tauri-runtime-wry 静态导入 comctl32 v6-only 符号（TaskDialogIndirect 等）；
# 正式 app 有 tauri-build 清单可解析，但 cargo test 的集成测试 exe 无 manifest
# → 加载即 STATUS_ENTRYPOINT_NOT_FOUND。关闭后两库均回落 MessageBoxW（user32，
# 恒可用）；Higher 未使用原生菜单/托盘/原生对话框，无视觉影响。
tauri = { version = "2.11.3", default-features = false, features = ["wry", "compression", "dynamic-acl", "x11", "dbus", "protocol-asset"] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
rusqlite = { version = "0.40.2", features = ["bundled"] }
# AI HTTP client (OpenAI-compatible REST; json + rustls TLS only, no heavy SDK)
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
tauri-plugin-notification = "2.3.3"
# DEV-SYNC-003 · QR Pairing：Android 相机扫码（官方插件；desktop 侧生成在前端 qrcode npm）
tauri-plugin-barcode-scanner = "2"
# DEV-0052 Personal Intelligence
tokio-util = "0.7"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
encoding_rs = "0.8"
quick-xml = "0.36"
# NOTE: zip / scraper / pdf-extract dependency chains contain build-script crates
# (crc32fast, markup5ever) blocked by Windows Smart App Control (os error 4551,
# confirmed twice). Direct flate2 dependency also perturbs the png->flate2
# feature union and re-triggers the blocked crc32fast build script. Using
# miniz_oxide directly (same backend, no crc32fast link) plus hand-written
# ZIP/HTML/PDF parsing. No security bypass.
miniz_oxide = { version = "0.8", default-features = false, features = ["std", "with-alloc"] }
tauri-plugin-opener = "2"
# DEV-0059 §31.3：导出文件 base64 编码传输（已在依赖树中，显式声明以便直接引用）
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
# DEV-SYNC-003 §五：枚举本机 IPv4 候选（QR candidate_ips；仅 Windows 侧需要）
ipconfig = "0.3"
