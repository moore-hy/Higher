name: Windows Release

# Higher Windows NSIS 发布流程。
#
# 触发：
#   - 推送 v* tag（如 v1.0.0 / v1.1.0）→ 自动构建并发布 GitHub Release
#   - workflow_dispatch（手动）→ 默认只验证构建；仅当 publish=true 才创建 Release
#
# 设计要点：
#   - 复用 scripts/Build-Higher-Release.ps1 作为唯一官方构建入口，不另写第二套构建系统
#   - 版本一致性门禁：tag(去v) 必须等于 package.json 与 tauri.conf.json 的版本
#   - 普通 push 到 main 不会触发本 workflow（on.push 仅匹配 tags），因此不会误发 Release
#   - 不写死任何 token / 绝对路径 / 用户名 / 密钥；仅使用默认 GITHUB_TOKEN

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Create GitHub Release and upload assets (tag push always publishes)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows NSIS installer
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: npm ci
        run: npm ci

      - name: Version gate (tag == package.json == tauri.conf.json)
        # 仅在 v* tag 推送时校验版本一致性；workflow_dispatch 走人工验证路径
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart('v')
          $pkg = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tauri = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          Write-Host "tag=v$tag  package=$pkg  tauri=$tauri"
          if ($tag -ne $pkg -or $tag -ne $tauri) {
            throw "VERSION_MISMATCH: git tag v$tag must equal package.json ($pkg) and src-tauri/tauri.conf.json ($tauri)"
          }

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Frontend build
        run: npm run build

      - name: Rust check
        working-directory: src-tauri
        run: cargo check -j 1

      - name: Build release (official script)
        shell: pwsh
        run: pwsh -File scripts/Build-Higher-Release.ps1

      - name: Publish GitHub Release
        # 正式 Release 只由 v* tag 触发；手动 dispatch 仅当 publish=true 才发布
        if: github.event_name == 'push' || inputs.publish == true
        uses: softprops/action-gh-release@v2
        with:
          name: Higher ${{ github.ref_name }}
          files: |
            release/Higher_*_Setup.exe
            release/Higher_*_SHA256.txt
          generate_release_notes: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
