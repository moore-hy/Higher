    <script>
      // DEV-0050 PHASE-A：浏览器复现专用 mock。
      // DEV-0065.4 §8.1：真实 Tauri 运行时（window.__TAURI_INTERNALS__ 存在）

        var s = document.createElement("script");

        document.head.appendChild(s);
      })();
    </script>
  </head>

    <script type="module" src="/src/main.tsx"></script>
